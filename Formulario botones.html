<!DOCTYPE html> <!-- Etiqueta que define el documento como html -->
<html> <!-- Raiz que contiene toda la informacion del documento -->
<!-- Seccion de configuracion no visible para la pagina web -->
<head>
  <meta charset="UTF-8"> <!-- Etiqueta que permite agregar caracteres especiales -->
  <title> Formularios en HTML Practica 7 (Formularios con botones) </title> <!-- Titulo que aparece en la barra de navegacion -->
</head>
<!-- Seccion que contiene la informacion del cuerpo visivle en la pagina web -->
<body> 
<h2> Formulario con botones </h2> <!-- titulo de nivel 2 -->
<!-- Seccion que abre un formulario -->
<form action="" method="post"> <!-- Raiz que almecan los datos guardados en el formulario, permanece inactiva al no tener una conexion -->
Ingresa tu nombre:
<input type="text" name="nombre"> <!-- Input que crea un campo tipo texto para guardar el nombre del usuario -->
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- Boton encargado de guardar la informacion guardada en los campos del formulario -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Boton encargado de borrar y desechar la informacion guardada en los campos del formulario y dejarlos en blanco -->
</form>
</body>
</html>
