<!DOCTYPE html> <!-- Etiqueta que define el documento como html -->
<html> <!-- Raiz que contiene toda la informacion del documento -->
  <!-- Seccion de configuracion no visible -->
<head> 
  <meta charset="UTF-8"> <!-- Etiqueta que permite el uso de caracteres especiales -->
  <title> Formularios en HTML Practica 7 (Formularios con checkbox) </title> <!-- Etiqueta que contiene el titulo en la barra del navegador -->
</head>
<!-- Seccion del cuerpo visible del docuemtno -->
<body>
<h2> Formulario con checkbox </h2> <!-- Titulo de nivel 2 -->
<!-- Seccion que contiene un formulario -->
<form action="" method="post"> <!-- Raiz que se encarga de guardar y enviar toda la informacion registrada en los campos del formulario -->
Ingresa tu nombre:
<input type="text" name="nombre"> <!-- Input que crea un campo del tipo texto encargado de almacenar el nombre del usuario -->
<br>
Selecciona los lenguajes que conozcas:
<br>
  <!-- Seccion que contiene input del tipo checkbox con sus respectivos valores para que el usuario seleccione los que desee -->
<input type="checkbox" name="Java">Java <br> <!-- Seleccion para Java -->
<input type="checkbox" name="Python"> Python <br> <!-- Seleccion para Python -->
<input type="checkbox" name="C#">C# <br> <!-- Seleccion para C# -->
<input type="checkbox" name="Flutter"> Flutter <br> <!-- Seleccion para Flutter -->
</form>
</body>
</html>
