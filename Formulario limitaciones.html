<!DOCTYPE html>
<html>
<head>
<meta charset="UTF 8">
<title> Formulario en HTML Practica 7 (Formularios con limitaciones) </title>
</head>

<body>
<h2> Formulario con limitaciones </h2>
<form action="" method="post">
Ingresa tu nombre:
<!-- Desahbilitacion de campo -->
<input type="text" name="nombre" disabled><br>
<!-- Limitacion de caracteres -->
Contraseña:
<input type="password" name="pass" maxlength="5"><br>
<!-- Solo lectura -->
Comentarios:
<textarea name="comentarios" readonly>

Este es mi comentario y no se puede borrar
</textarea><br>
</form>
</body>
</html>
