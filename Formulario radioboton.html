<!DOCTYPE html> <!-- Etiqueta que define el documento como html -->
<html> <!-- Raiz que almacea toda la informacion del documento html -->
  <!-- Seccion de configuracion no visible en l apagina web -->
<head>
  <meta charset="UTF-8"> <!-- Etiqueta que permite usar caracteres especiales -->
  <title> Formularios en HTML Practica 7 (Formularios con radioboton) </title> <!-- Titulo que aparecera en la barra del navegador -->
</head>
<!-- Seccion del cuerpo visible de la pagina web -->
<body>
<h2> Formulario con radioboton </h2> <!-- Titulo de nivel 2 -->
<!-- Seccion que contiene un formulario -->
<form action="" method="post"> <!-- Raiz encargada de almacenar los datos enviados del formulario, permanece vacia -->
Ingresa tu nombre:
<input type="text" name="nombre"> <!-- Input que crea un campo tipo texto para almacenar el nombre del usuario -->
<br>
Selecciona el maximo de estudios que tienes:
<br>
<!-- Seccion de radio botones que muestran opciones de niveles de estudios a elegir -->
<input type="radio" name="estudios" value="1">Sin estudios <br>
<input type="radio" name="estudios" value="2">Primaria <br>
<input type="radio" name="estudios" value="3">Secundaria <br>
<input type="radio" name="estudios" value="4">Preparatoria <br>
<input type="submit" value="enviar"> <!-- Input que crea un boton del tipo registrar (submit) para enviar la opcion seleccionada en el formulario -->
<input type="reset" value="borrar"> <!-- Input que crea un boton del tipo borrar (reset) para dejar en blanco los campos del formulario -->
</form>
</body>
</html>
