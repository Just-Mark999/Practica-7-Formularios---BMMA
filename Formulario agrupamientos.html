<!DOCTYPE html> <!-- Etiqueta que define el docuemtno como html -->
<html> <!-- Raiz que contiene todo el documento html -->
<!-- Seccion que contiene informacion de configuracion no visible -->
<head>
  <meta charset="UTF-8"> <!-- Etiqueta que permite usar caracteres especiales -->
  <title> Formularios en HTML Practica 7 (Formularios con agrupamiento) </title> <!-- Titulo que aparecera en la barra de navegacion -->
</head>

<!-- Seccion del contenido visible en la pagina web -->
<body>
<h2> Formulario con agrupamiento </h2> <!-- Titulo de nivel " -->

<!-- Seccion que crea un formulario con agrupamientos -->
<form action="" method="post"> <!-- Raiz en la cual se almacenan los datos guardados, permanece vacia sin una conexion -->
<fieldset> <!-- Etiqueta que agrupa campos y controles en el formulario -->
<legend>Datos personales</legend> <!-- Titulo de una agrupacion dentro un formulario -->
Nombre y apellido:
<input type="text" name="nombre_apellido"><br> <!-- Input que crea un campo del tipo texto para guardar informacion de nombre y apellido -->
Documento valido:
<input type="file" name="documento"><br> <!-- Input que crea un campo del tipo file para agregar documentos -->
Fecha de nacimiento:
<input type="date" name="fecha_nacimiento"> <!-- Input que crea un campo del tipo date para guardar la fecha de nacimiento -->
</fieldset>
  
<fieldset> <!-- Etiqueta que agrupa campos y controles en el formulario -->
<legend>Datos de estudio:</legend> <!-- Titulo de una agrupacion dentro de un formulario -->
Nombre de la escuela:
<input type="text" name="escuela"><br> <!-- Input que crea un campo del tipo texto para guardar informacion del nombre de la escuela -->
Certificado valido:
<input type="file" name="certificado"><br> <!-- Input que crea un campo tipo file para agregar el documento certificado -->
Fecha de egreso:
<input type="date" name="fecha_egreso"> <!-- Input que crea un campo tipo date para guardar informacion de la fecha de egreso de la escuela -->
</fieldset>
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- Boton encargado de enviar los datos guardados en los formularios junto con los documentos anexados -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Boton encargado de borrar todos los datos del formulario y vaciar los campos -->
</form>
</body>
</html>
