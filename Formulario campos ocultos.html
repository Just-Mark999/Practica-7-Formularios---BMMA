<!DOCTYPE html> <!-- Etieuqet aque define el documento como html -->
<html> <!-- Raiz que alamecna toda la informacion del documento -->
<!-- Seccion de informacion no visible en l a pagina web -->
<head>
  <meta charset="UTF-8"> <!-- Etiqueta que permite usar caracteres especiales -->
  <title> Formularios en HTML Practica 7 (Formularios con campos ocultos) </title> <!-- Titulo que aparecera en la barra del navegador -->
</head>
<!-- Seccion del cuerpo visible de la pagina web -->
<body>
<h2> Formulario con campos ocultos </h2> <!-- Titulo de nivel 2 -->
<!-- Seccion que contiene un formulario -->
<form action="" method="post"> <!-- Raiz que se encarga de guardar y enviar los datos almacenados en un formulario, permance en blanco sin una conexion -->
<input type="hidden" name="hora" value="3:30"> <!-- Input del tipo "Hidden (oculto)" no visible para el usuario que define la hora como 3:30 -->
Ingresa tu nombre:
<input type="text" name="nombre"> <!-- Input que crea un campo del tipo textoy almacena un nombre -->
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- Radioboton que se encarga de enviar la informacion guardada en los campos del formulario -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Radioboton que se encarga de borrar la informacion en los campos del formualrio y de dejarlos en blanco -->
</form>
</body>
</html>
