<!DOCTYPE html> <!-- Etiqueta que define el documento como html -->
<html> <!-- Ertiqueta raiz que contiene toda la informacion del documento -->
<!-- Seccion de configuracion no visible en la pagina -->
<head>
  <meta charset="UTF-8"> <!-- Etiqueta que permite el uso de caracteres especiales -->
  <title> Formularios en HTML Practica 7 (Formulario para contraseñas) </title> <!-- Titulo que aparece en la barra del navegador -->
</head>
<!-- Seccion que contiene el cuerpo visible del documento html -->
<body>
<h2> Formulario para contraseñas </h2> <!-- Titulo de nivel 2 -->
<form action="" method="post"> <!-- Raiz encargada de almacenar y enviar los datos guardados en los campos de un formulario, permanece en blanco -->
Ingresa tu usuario: <br>
<input type="text" name="usuario"> <br> <!-- Input que crea un campo el tipo texto que pemrite almacenar el nombre del usuario -->
Ingresa tu contraseña: <br>
<input type="password" name="pass"> <!-- Input que crea un campo del tipo contraseña (password) que almacena y registra la contraseña del usuario -->
<br>
<input type="submit" value="enviar"> <!-- Input que crea un boton del tipo enviar (submit) para guardar los datos registrados en los campos del formulario -->
<input type="reset" value="borrar"> <!--Input que crea un boton del tipo reset para limpiar los campos y dejarlos en blanco -->
</form>
</body
</html>
