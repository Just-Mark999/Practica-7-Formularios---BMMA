<!DOCTYPE html> <!-- Etiqueta que define el documento como html -->
<html> <!-- Raiz que contiene toda la informacion de la pagina web -->
  <!-- Seccion que contiene informacion no visible en la pagina web -->
<head>
  <meta charset="UTF-8"> <!-- Etiqueta que permite utilizar caracteres especiales -->
  <title> Formularios en HTML Practica 7 (Formularios con archivos) </title> <!-- Etiqueta que contiene el titulo que aparecera en la barra del navegador -->
</head>
<!-- Seccion que contiene la informacion visible en la pagina web -->
<body>
<h2> Formulario con archivos </h2><!-- Titulo de nivel 2 -->
<!-- Seccion que contiene un formulario -->
<form action="" method="post"> <!-- Raiz que guarda y envia toda la informacion contenida en los campos del formulario, permanece inactiva -->
Ingresa tu nombre:
<input type="text" name="nombre"> <!-- Input que crea un campo del tipo texto para guardar el nombre del usuario -->
<br>
<input type="file" name="archivo"> <!-- Input que crea un campo del tipo documento (file) para que el usuario suba archivos de su eleccion y guardarlos -->
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- Boton encargado de enviar y guardar los datos de todos los campos con contenido del formulario -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Boton encargado de borrar y dejar en blanco todos los campos del formulario y desechar la informacion que hayan tenido sin registrar -->
</form>
</body>
</html>
