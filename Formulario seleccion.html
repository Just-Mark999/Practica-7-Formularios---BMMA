<!DOCTYPE html> <!-- Etiqueta qu define el documento como html -->
<html> <!-- Raiz que almacena toda la informacion del documento html -->
<!-- Seccion de iformacio no visible en la pagina web -->
<head>
  <meta charset="UTF-8"> <!-- Etiqueta que habilita el uso de caracteres especiales -->
  <title> Formularios en HTML Practica 7 (Formularios con seleccion) </title> <!-- Titulo que aparece en la barra del navegador -->
</head>
<!-- Cuerpo visible del documento html -->
<body>
<h2> Formulario con seleccion </h2> <!-- Titulo de nivel 2 -->
<!-- Seccion que almacena un formulario -->
<form action="" method="post"> <!-- Raiz encargada de almacenar la informacion enviada por el formulario, permanece inactiva -->
Ingresa tu nombre:
<input type="text" name="nombre"> <!--

<br>
Selecciona tu pais:
<select name="pais">
<option value="1">Argentina</option>
<option value="2">España</option>
<option value="3">Mexico</option>
<option value="4">Guatemala</option>
<option value="5">Honduras</option>
<option value="6">El Salvador</option>
<option value="7">Venezuela</option>
<option value="8">Colombia</option>
</select>
<br>
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form>

</body>
</html>
